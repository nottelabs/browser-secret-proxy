name: E2E

# Runs the proxy image against Notte staging: a real browser session sends one
# host through the proxy, exposed on a public address with a bore tunnel, and
# the job checks that host receives the real value (scripts/e2e-notte.sh).
#
# Needs the NOTTE_API_KEY repository secret (a staging key). Pull requests from
# forks get no secrets, so the job skips them.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BORE_VERSION: v0.6.0
  BORE_SHA256: e484d1e3acba77169b773f31a5bfb34192d4b660f44a094a658a2522cd2270f7

jobs:
  staging:
    name: swap through a Notte staging session
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: make docker
      - name: Install bore
        run: |
          archive="bore-${BORE_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/ekzhang/bore/releases/download/${BORE_VERSION}/$archive"
          echo "${BORE_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bin" bore
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Run against staging
        env:
          NOTTE_API_KEY: ${{ secrets.NOTTE_API_KEY }}
          NOTTE_API_URL: https://us-staging.notte.cc
        run: scripts/e2e-notte.sh
