# Managed by repo-baseline. The jobs live in nottelabs/shared-gh-workflows.
name: shared

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, labeled, unlabeled, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  all:
    uses: nottelabs/shared-gh-workflows/.github/workflows/reusable-all.yml@main
    secrets: inherit # pragma: allowlist secret (GitHub Actions keyword, no secret value)
