# GoReleaser configuration.
#   Local, unsigned and unpublished: make snapshot
#   Release: push a vX.Y.Z tag; .github/workflows/release.yml runs GoReleaser
#   with keyless cosign signing.
version: 2

# The single name setting: binaries, archives and the image follow it.
project_name: browser-secret-proxy

before:
  hooks:
    - go mod download

builds:
  - id: proxy
    main: ./cmd/secret-proxy
    binary: "{{ .ProjectName }}"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    # Sets the version that `-version` prints.
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: proxy
    ids:
      - proxy
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

# One SPDX SBOM per archive, generated by syft.
sboms:
  - artifacts: archive

# Keyless signing: in GitHub Actions cosign uses the workflow's OIDC token, and
# the signature bundle records the workflow identity. Verify with
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/nottelabs/browser-secret-proxy/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes

dockers_v2:
  - id: proxy
    ids:
      - proxy
    dockerfile: Dockerfile.goreleaser
    images:
      - "{{ envOrDefault \"IMAGE_REPOSITORY\" (printf \"ghcr.io/nottelabs/%s\" .ProjectName) }}"
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: Forward proxy that replaces stand-in values with real secrets on allowlisted hosts
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.licenses: Apache-2.0
    build_args:
      BINARY: "{{ .ProjectName }}"
    sbom: true

docker_signs:
  - id: images
    cmd: cosign
    artifacts: images
    args:
      - sign
      - ${artifact}@${digest}
      - --yes

changelog:
  # Release notes come from CHANGELOG.md, not from commit messages:
  # release.yml passes the tag's section with --release-notes
  # (scripts/release-notes.sh).
  disable: true

release:
  draft: false
  prerelease: auto
  footer: |
    Verify the checksums signature and the images as described in the README.
